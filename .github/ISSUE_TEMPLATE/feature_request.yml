name: Feature request
description: Something Nimlet should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where Nimlet got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
